buildscript {
  def kotlinVersion = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "2.1.20"
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.+"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// The Stockfish NNUE network is NOT bundled into the APK/AAB: ~94 MB would be
// most of the Play download and would push the base delivery towards Google's
// 200 MB ceiling. It is fetched at runtime instead — see NnueDownloader.kt —
// so there is no build-time download step here any more.

android {
  namespace "com.dawikk.stockfish"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 29)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17 -fexceptions -frtti"
        // ANDROID_ARM_NEON is the NDK default for armeabi-v7a these days, but
        // the NNUE code is only built with USE_NEON=7 on that ABI, so make the
        // requirement explicit rather than inherited.
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_ARM_NEON=TRUE"
      }
    }

    ndk {
      // armeabi-v7a is here because the app ships React Native's default
      // architectures, which include it. Without a matching libstockfish.so a
      // device served that split had no engine at all — and, before the load
      // was guarded, no app either.
      abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
}
